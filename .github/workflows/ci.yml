name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # 插件面向 Windows 上的 MSYS2 / CubeMX 工具链，离线套件也在 Windows 上验收，直接用 windows runner。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # lib/ 是入库的（git 安装不会构建），所以这里必须保证提交的产物和 src/ 一致。
      - name: Check lib/ is in sync with src/
        shell: pwsh
        run: |
          $diff = git status --porcelain -- lib
          if ($diff) {
            Write-Host $diff
            throw "lib/ is stale: run 'npm run build' and commit lib/ together with src/."
          }
      - run: npm test
      # 发布形态烟测：npm pack 解包后真建一个寄存器工程。挡住"源码安装测不出、
      # npm 安装必炸"的一整类问题（.gitignore 被 npm 排除、模板清单与打包内容不一致）。
      - run: npm run test:pack
      # 包体护栏：tarball ≤1.2 MB、templates ≤60 KB、包内不许有 png/html 之类资产。
      # 目的不是抠体积，而是拦住「把图片/固件包/板级 .ioc 顺手塞进仓库」这类长期臃肿。
      - run: npm run test:size
