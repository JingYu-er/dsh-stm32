name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # 插件面向 Windows 上的 MSYS2 / CubeMX 工具链，离线套件也在 Windows 上验收，直接用 windows runner。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
