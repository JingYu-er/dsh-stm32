# CMSIS-DAP 探针 + SWD。stm32_project_create 生成；换 ST-Link 就把 source 换成
# interface/stlink.cfg，J-Link 用 interface/jlink.cfg。adapter speed 可在 1000~5000 之间调。
# transport 必须写 swd：hla_swd 只有 st-link 系适配器支持，CMSIS-DAP 会报
# 「Debug adapter doesn't support 'hla_swd' transport」直接连不上。
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f1x.cfg]
adapter speed 2000
