# CMSIS-DAP 探针 + SWD。stm32_project_create 生成（实见 ST-Link 时这里会换成
# interface/stlink-dap.cfg）；J-Link 用 interface/jlink.cfg。adapter speed 可在 1000~5000 之间调。
# transport 必须写 swd：hla_swd 只有 st-link 的 hla 驱动支持，CMSIS-DAP 会报
# 「Debug adapter doesn't support 'hla_swd' transport」直接连不上。
# ST-Link 用 stlink-dap（dapdirect）而不是 stlink.cfg（hla）——C0/U0 一类新族 target
# 脚本走的是 swj-dp.tcl，hla 会报 transport 不支持。
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f1x.cfg]
adapter speed 2000
